
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Resource &amp; Lesson Hub</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>Teacher Resource &amp; Lesson Hub</h1>
        <p class="subtitle">Organize classes, weekly lesson plans, and teaching resources in one place.</p>
      </div>
      <div class="topbar-actions">
        <span id="apiStatus" class="status-badge status-checking">Checking API...</span>
        <button id="exportCsvBtn" type="button" class="btn btn-secondary">Export CSV</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="filter-bar card" aria-label="Filter lessons">
      <div class="filter-grid">
        <div class="field">
          <label for="filterClass">Class / School</label>
          <select id="filterClass">
            <option value="">All Classes</option>
          </select>
        </div>
        <div class="field">
          <label for="filterSubject">Subject</label>
          <input id="filterSubject" type="text" placeholder="e.g. Arabic, English, Math" />
        </div>
        <div class="field">
          <label for="filterQuery">Search Topic or Notes</label>
          <input id="filterQuery" type="search" placeholder="Search keyword..." />
        </div>
        <div class="field filter-buttons">
          <button id="applyFiltersBtn" type="button" class="btn btn-primary">Filter</button>
          <button id="resetFiltersBtn" type="button" class="btn btn-ghost">Reset</button>
        </div>
      </div>
    </section>

    <section class="workspace-grid">
      <div class="forms-column">
        <form id="classForm" class="card">
          <h2>Add Class / School</h2>
          <div class="field">
            <label for="schoolName">School Name</label>
            <input id="schoolName" name="school_name" type="text" required placeholder="e.g. Al-Hilal School, Okene" />
          </div>
          <div class="field">
            <label for="className">Class Name</label>
            <input id="className" name="class_name" type="text" required placeholder="e.g. JSS 1A" />
          </div>
          <div class="field">
            <label for="termLabel">Term / Session</label>
            <input id="termLabel" name="term_label" type="text" required placeholder="e.g. First Term 2026/2027" />
          </div>
          <button type="submit" class="btn btn-primary full-width">Save Class</button>
        </form>

        <form id="lessonForm" class="card">
          <h2>Create Lesson Plan</h2>
          <div class="field">
            <label for="lessonClassId">Target Class</label>
            <select id="lessonClassId" name="class_id" required>
              <option value="">Select a class...</option>
            </select>
          </div>
          <div class="two-col">
            <div class="field">
              <label for="lessonSubject">Subject</label>
              <input id="lessonSubject" name="subject" type="text" required placeholder="e.g. Arabic Grammar" />
            </div>
            <div class="field">
              <label for="lessonWeek">Week No.</label>
              <input id="lessonWeek" name="week_number" type="number" min="1" max="52" required value="1" />
            </div>
          </div>
          <div class="field">
            <label for="lessonTopic">Lesson Topic</label>
            <input id="lessonTopic" name="topic" type="text" required placeholder="e.g. Nominal & Verbal Sentences" />
          </div>
          <div class="field">
            <label for="lessonObjectives">Learning Objectives</label>
            <textarea id="lessonObjectives" name="objectives" rows="2" placeholder="What should learners be able to do?"></textarea>
          </div>
          <div class="field">
            <label for="lessonNotes">Lesson Notes &amp; Key Points</label>
            <textarea id="lessonNotes" name="lesson_notes" rows="3" placeholder="Examples, definitions, class activities..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary full-width">Add Lesson</button>
        </form>
      </div>

      <section class="lessons-column">
        <div class="section-header">
          <h2>Lessons &amp; Attached Resources</h2>
          <span id="lessonCount" class="count-pill">0 lessons</span>
        </div>
        <div id="feedbackBanner" class="feedback hidden" role="status"></div>
        <div id="lessonsList" class="lessons-list">
          <p class="empty-state">Loading lessons...</p>
        </div>
      </section>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
